[project]
name = "ai-content-trailer"
version = "0.1.0"
description = "Local pipeline that builds content-driven video trailers from long talks and lectures"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "yt-dlp>=2024.8.6",
    "youtube-transcript-api>=1.0",
    "openai>=1.40",
    "gigachat>=0.2.4",
    "imageio-ffmpeg>=0.8.1",
    "langfuse>=4.0",
    "aiogram>=3.31,<4",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trailer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "integration: end-to-end tests that exercise the full pipeline (may require ffmpeg)",
]
